<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HaBiTa</title>
  <meta name="description" content="毎日の習慣を記録して、連続記録を伸ばすシンプルなアプリ">

  <!-- iPhone ホーム画面アプリ用 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HaBiTa">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="メインメニュー">
    <button class="tab" data-tab="today" aria-label="今日">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-tab="stats" aria-label="記録">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>記録</span>
    </button>
    <button class="tab" data-tab="settings" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>設定</span>
    </button>
  </nav>

  <div id="sheet-root" class="sheet-root" hidden>
    <div class="sheet-backdrop" data-close-sheet></div>
    <section class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div id="sheet-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
