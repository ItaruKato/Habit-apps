<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <!-- 地: 鮮やかな紅 → 深いクリムゾン（濁らないよう青みを少し残す） -->
  <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#C40F2C"/><stop offset=".55" stop-color="#9C0826"/><stop offset="1" stop-color="#5C031C"/>
  </linearGradient>
  <!-- 炎の背後の光: 中心は金色がかったオレンジ、外へ向かって赤に溶ける -->
  <radialGradient id="gg" cx="0.5" cy="0.56" r="0.62">
    <stop offset="0" stop-color="#FFC04A"/>
    <stop offset=".42" stop-color="#FF7A2E" stop-opacity=".95"/>
    <stop offset=".62" stop-color="#F2292E" stop-opacity=".7"/>
    <stop offset=".85" stop-color="#C8102E" stop-opacity=".15"/>
    <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
  </radialGradient>
  <!-- 上部の柔らかいハイライト -->
  <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".06"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <!-- 炎の縁に深紅の影を落として、光の上でも輪郭をくっきりさせる -->
  <filter id="gs" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#5A0015" flood-opacity=".5"/>
  </filter>
</defs>
<rect width="1024" height="1024" fill="url(#gb)"/>
<rect width="1024" height="1024" fill="url(#gg)"/>
<rect width="1024" height="1024" fill="url(#gt)"/>
<g transform="translate(512 512) scale(0.92) translate(-521 -508)">
  <path d="M520 132 C 548 252 650 318 718 420 C 778 510 792 600 772 682 C 742 806 636 884 512 884 C 382 884 270 798 250 668 C 236 574 270 488 334 420 C 344 486 372 530 418 556 C 400 446 420 330 470 246 C 488 214 506 176 520 132 Z" fill="#fff" filter="url(#gs)"/>
  <path d="M396 666 L478 744 L630 590" stroke="#D0152C" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g></svg>